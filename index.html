<style>
:root{
  --bg:#e4e6e7; --surface:#f6f7f7; --ink:#1a1d20; --ink2:#666d73;
  --line:rgba(26,29,32,.12); --line2:rgba(26,29,32,.28);
  --empty-hover:rgba(26,29,32,.06);
  --accent:#4d6b7a; --danger:#9a4a45;
  --font-ui:"Jost","Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --surface:#1a1d20; --ink:#e7e9ea; --ink2:#8f979d;
    --line:rgba(231,233,234,.11); --line2:rgba(231,233,234,.26);
    --empty-hover:rgba(231,233,234,.07);
    --accent:#93b1bf; --danger:#c9736c;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d20; --ink:#e7e9ea; --ink2:#8f979d;
  --line:rgba(231,233,234,.11); --line2:rgba(231,233,234,.26);
  --empty-hover:rgba(231,233,234,.07);
  --accent:#93b1bf; --danger:#c9736c;
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  overflow:hidden;overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;cursor:pointer}

#app{height:100%;display:flex;flex-direction:column;width:100%;max-width:760px;margin:0 auto;padding:0 16px}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:10px;animation:fade .9s ease backwards}
.mark{width:22px;height:22px;flex:none;color:var(--ink)}
.word{font:300 24px/1 var(--font-ui);letter-spacing:.08em}
.tag{font-size:12px;color:var(--ink2);padding-left:14px;border-left:1px solid var(--line2);line-height:1.3;letter-spacing:.06em}
@keyframes fade{from{opacity:0}}

/* breadcrumbs */
.crumbrow{display:flex;align-items:center;gap:8px;height:44px;border-bottom:1px solid var(--line)}
.ico{width:30px;height:30px;border-radius:3px;border:1px solid var(--line2);background:transparent;display:grid;place-items:center;flex:none}
.ico:active{background:var(--empty-hover)}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{border:0;background:transparent;padding:6px 7px;border-radius:2px;font-size:13px;letter-spacing:.04em;color:var(--ink2);flex:none;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.crumb.cur{color:var(--ink);font-weight:500}
.sep{color:var(--ink2);opacity:.45;flex:none;font-weight:300}
.pill{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:3px;padding:6px 10px;font-size:12px;font-weight:500;letter-spacing:.04em}
.pill:active{background:var(--empty-hover)}

/* board */
.stage{
  position:relative;
  flex:1;min-height:0;container-type:size;display:flex;padding:12px 10px 10px;margin:0 -10px;
  overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
}
.stage::-webkit-scrollbar{width:10px;height:10px}
.stage::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid transparent;background-clip:padding-box}
.stage::-webkit-scrollbar-thumb:hover{background:var(--ink2);background-clip:padding-box}
.stage::-webkit-scrollbar-corner{background:transparent}

/* cells keep a square shape. Up to 12 across they fill the screen; beyond that they stop shrinking
   and the stage scrolls — --zoom (from the zoom control) scales this further in either direction,
   letting a big grid (up to 32x32 and beyond) be shrunk to fit, or a small one be enlarged. */
.frame{
  --gx:0px;--gy:0px;--gb:0px;--fit:12;--zoom:1;
  --s:calc(max(calc(min(100cqw - var(--gx),100cqh - var(--gy) - var(--gb)) / var(--fit)),min(calc((100cqw - var(--gx)) / var(--cols)),calc((100cqh - var(--gy) - var(--gb)) / var(--rows)))) * var(--zoom));
  --bw:calc(var(--cols) * var(--s));
  --gap:clamp(2px,calc(var(--s) * .06),6px);
  flex:none;margin:auto;display:grid;grid-template-columns:var(--gx) var(--bw);grid-template-rows:var(--gy) auto var(--gb);
}
.frame[data-mode="matrix"]{--gx:52px;--gy:36px}
.frame[data-mode="graph"]{--gx:76px;--gb:66px}
.board{
  grid-area:2 / 2;position:relative;width:var(--bw);aspect-ratio:var(--cols) / var(--rows);container-type:inline-size;
  display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);
  gap:var(--gap);touch-action:none;
}
.stage.scrollable .board{touch-action:pan-x pan-y}
.zoombar{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;
  display:flex;gap:2px;background:var(--surface);border:1px solid var(--line2);border-radius:5px;
  padding:3px;box-shadow:0 6px 18px rgba(0,0,0,.18);
}
.zoombar button{width:30px;height:30px;border:0;background:transparent;color:var(--ink);border-radius:3px;font:400 17px/1 var(--font-ui);display:grid;place-items:center;padding:0}
.zoombar button:active{background:var(--empty-hover)}
.zoombar button:disabled{opacity:.35;cursor:default}
.board.editing{outline:1px dashed color-mix(in srgb,var(--accent) 65%,transparent);outline-offset:10px}
.edge{position:absolute;z-index:3;pointer-events:none;background:var(--accent);border-radius:2px}
.edge.top{left:0;right:0;top:-6px;height:3px}
.edge.bottom{left:0;right:0;bottom:-6px;height:3px}
.edge.left{top:0;bottom:0;left:-6px;width:3px}
.edge.right{top:0;bottom:0;right:-6px;width:3px}
.cell{
  --cw:calc(100cqw / var(--cols));
  container-type:inline-size;
  position:relative;border-radius:min(4px,calc(var(--cw) * .07));overflow:hidden;cursor:pointer;outline:none;
  background:transparent;box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .15s,background .15s,opacity .15s;
  -webkit-user-select:none;user-select:none;
}
/* once a cell renders too small to read, stop squeezing its text/icon/thumbnail in and show a
   plain presence mark instead — a dot for a memo, a small square for a sub-grid — so it's still
   obvious the cell is filled even zoomed far out over a large grid. */
@container (max-width: 24px) {
  .cell.note .txt,.cell.note .cicon,.cell.note .cimg,.cell.grid .txt,.cell.grid .gridmark{visibility:hidden}
  .cell.note::after,.cell.grid::after{
    content:""!important;position:absolute!important;inset:0!important;right:auto!important;bottom:auto!important;
    margin:auto!important;width:30%!important;height:30%!important;min-width:3px;min-height:3px;max-width:7px;max-height:7px;
    background:var(--on,var(--ink))!important;opacity:.6!important;box-shadow:none!important;
  }
  .cell.note::after{border-radius:50%!important}
  .cell.grid::after{border-radius:1px!important}
}
.cell:active{transform:scale(.97)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cell.drop{outline:2px solid var(--accent);outline-offset:1px;transform:scale(1.04);z-index:2}
.cell.lift{opacity:.28;transform:scale(.95)}

.cell.empty::after{
  content:"+";position:absolute;inset:0;display:grid;place-items:center;
  font-size:calc(var(--cw) * .36);font-weight:200;color:var(--ink2);opacity:0;transition:opacity .15s;
}
@media (hover:hover){
  .cell.empty:hover{background:var(--empty-hover)}
  .cell.empty:hover::after{opacity:.6}
  .cell:not(.empty){cursor:grab}
}

/* note: solid tile with text and a folded corner */
.cell.note{
  background:var(--surface);color:var(--on,var(--ink));
  box-shadow:inset 0 0 0 1px var(--line2);
}
.cell.note.colored{
  background:color-mix(in srgb,var(--c) calc(var(--a) * 100%),var(--surface));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent);
}
.cell.note .txt{
  position:absolute;inset:max(3px,calc(var(--cw) * .09));overflow:hidden;
  font-size:clamp(5px,calc(var(--cw) * .095),10px);line-height:1.25;font-weight:500;letter-spacing:.01em;
  word-break:break-all;
}
/* the ideal title size depends on the device, not just the cell's own pixel width: a phone screen
   only has room for a few characters before this would need to shrink to the point of illegibility,
   so it uses a smaller scale and cap; a larger desktop screen has room to go noticeably bigger and
   more readable instead of staying tiny just because the grid itself has many cells. The inset above
   keeps a real minimum gap (not just a percentage of a small cell) so bigger text never crowds the
   cell's own border. */
@media (max-width:640px){
  .cell.note .txt{font-size:clamp(4.5px,calc(var(--cw) * .075),8px)}
  .cell.grid .ttl{font-size:clamp(5px,calc(var(--cw) * .095),8.5px)}
}
@media (min-width:1024px){
  .cell.note .txt{font-size:clamp(8px,calc(var(--cw) * .15),18px);line-height:1.3}
  .cell.grid .ttl{font-size:clamp(8.5px,calc(var(--cw) * .17),18px)}
}
.cell.note .txt.ph{opacity:.42}
.cell.note .cimg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-user-drag:none;
}
.cell.note .cicon{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--on,var(--ink));
}
.cell.note .cicon svg{width:52%;height:52%;max-width:34px;max-height:34px}
.cell.note.w::after{
  content:"";position:absolute;right:0;bottom:0;width:calc(var(--cw) * .17);aspect-ratio:1;
  background:linear-gradient(135deg,transparent 50%,color-mix(in srgb,currentColor 26%,transparent) 50%);
}

/* grid: framed tile containing a miniature of the lower level */
.cell.grid{
  background:color-mix(in srgb,var(--c,var(--ink)) calc(var(--a,.09) * 100%),var(--surface));color:var(--on,var(--ink));
  box-shadow:inset 0 0 0 max(1.5px,calc(var(--cw) * .03)) var(--c,var(--ink));
}
.cell.grid .txt{
  position:absolute;inset:max(3px,calc(var(--cw) * .09));overflow:hidden;
  font-size:clamp(5px,calc(var(--cw) * .095),10px);line-height:1.25;font-weight:500;letter-spacing:.01em;
  word-break:break-all;
}
.cell.grid .gridmark{

.ghost{position:absolute;z-index:20;pointer-events:none;transform:scale(1.05);box-shadow:0 18px 34px rgba(0,0,0,.26);transition:none;opacity:.97}

/* bottom bar */

/* sheet */

}

.dlg-scrim{position:fixed;inset:0;background:rgba(10,12,14,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}

/* transparency slider */
.row-label.first{margin-top:0}

.alpha output{width:3em;text-align:right;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.alpha input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:26px;margin:0;background:transparent;cursor:pointer}
.alpha input[type=range]::-webkit-slider-runnable-track{

  background:linear-gradient(to right,var(--cf,var(--accent)),color-mix(in srgb,var(--cf,var(--accent)) 8%,var(--surface)));
}

  width:22px;height:22px;border:0;border-left:8px solid transparent;border-right:8px solid transparent;
  background:var(--ink);background-clip:padding-box;border-radius:0;
}

/* ---- mode row ---- */
.moderow{display:flex;align-items:center;justify-content:space-between;gap:10px;height:42px}
.modesel{display:flex;align-items:center;gap:10px;min-width:0}
.modesel>span{font-size:12px;color:var(--ink2);letter-spacing:.08em;flex:none}
#modeSel{
  -webkit-appearance:none;appearance:none;height:34px;min-width:124px;padding:0 32px 0 12px;
  border:1px solid var(--line2);border-radius:3px;background-color:transparent;color:var(--ink);
  font:500 13px var(--font-ui);letter-spacing:.06em;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
#modeSel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.moderow .dims{font-size:15px}
.moderow .dims .dl{font-size:10.5px;margin-right:4px}
.moderow .dims .x{margin:0 5px}

/* ---- ListMode: cells line up from the left; empty slots are only placeholders ---- */
.board.list .cell.empty{box-shadow:none;outline:1px dashed var(--line2);outline-offset:-1px;cursor:default}
.board.list .cell.empty::after{content:none}
.board.list .cell.empty:hover{background:transparent}
.board.list .cell[data-n]::before{
  content:attr(data-n);position:absolute;left:calc(var(--cw) * .1);bottom:calc(var(--cw) * .07);z-index:1;pointer-events:none;
  font:300 clamp(6px,calc(var(--cw) * .15),10px)/1 var(--font-ui);letter-spacing:.06em;opacity:.55;
}

/* ---- MatrixMode: axis labels outside the grid ---- */
.colhead{
  grid-area:1 / 2;width:var(--bw);display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap);
  padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid var(--line2);
}
.rowhead{
  grid-area:2 / 1;display:grid;grid-template-rows:repeat(var(--rows),1fr);gap:var(--gap);
  padding-right:6px;margin-right:6px;border-right:1px solid var(--line2);
}
.frame:not([data-mode="matrix"]) .colhead,.frame:not([data-mode="matrix"]) .rowhead{display:none}
.lab{
  min-width:0;min-height:0;border:0;background:transparent;padding:0 2px;display:flex;align-items:center;border-radius:2px;
  font:500 11px/1.25 var(--font-ui);letter-spacing:.03em;color:var(--ink);
}
.colhead .lab{justify-content:center;text-align:center;align-items:flex-end}
.rowhead .lab{justify-content:flex-end;text-align:right}

.lab:active{background:var(--empty-hover)}
.lab.empty{box-shadow:inset 0 0 0 1px var(--line2)}
.lab.empty::after{content:"＋";margin:auto;font-size:11px;font-weight:300;color:var(--ink2);opacity:.6}
.lab{cursor:grab;touch-action:none}
.lab.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.labghost{position:fixed;z-index:60;pointer-events:none;background:var(--surface);box-shadow:0 10px 26px rgba(0,0,0,.28),inset 0 0 0 1px var(--line2);opacity:.96;display:flex;align-items:center;border-radius:2px;padding:0 2px}

/* ---- PriorityMode: the cell's own background IS the priority signal — every cell, filled or
   empty, is tinted from strong (high priority) to faint (low priority) by its position. A cell's
   own chosen colour, if any, blends over that tint by its own alpha rather than replacing it, so
   category colour and priority read together at a glance. A legend in the control panel (not on
   the grid) spells out what the shade means, the same way for every shape. ---- */
/* Priority mode otherwise looks exactly like Free mode — same fill, same rings, same shape.
   Empty cells carry the full priority tone as their background (there's no text to protect, so the
   whole tile can read as a heatmap swatch). Filled cells keep their normal fill and simply gain one
   extra, slightly heavier ring tinted by the position's priority, on top of whatever ring they'd
   already have (a category-colour ring, or a sub-grid marker) — so priority reads as one added
   accent rather than a different design. */
.board[class*="prio-"] .cell.empty{background:var(--pr,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
.board[class*="prio-"] .cell.note{box-shadow:inset 0 0 0 1px var(--line2),inset 0 0 0 3px var(--pr,transparent)}
.board[class*="prio-"] .cell.note.colored{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent),inset 0 0 0 3px var(--pr,transparent)}
.board[class*="prio-"] .cell.grid{box-shadow:inset 0 0 0 max(1.5px,calc(var(--cw) * .03)) var(--c,var(--ink)),inset 0 0 0 3px var(--pr,transparent)}
.plegend{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:2px}
.plegend-head{border:0;background:transparent;color:var(--ink2);font-size:12px;letter-spacing:.08em;padding:2px 6px;border-radius:2px}
.plegend-head:active{background:var(--empty-hover)}
.plegend-head.empty{opacity:.55}
.plegend-row{display:flex;align-items:center;gap:8px;width:100%}
.plegend-grad{flex:1;height:14px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--line2)}
.plegend-end{flex:none;border:0;background:transparent;color:var(--ink);font-size:12px;font-weight:500;letter-spacing:.04em;padding:4px 6px;border-radius:2px;max-width:6em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plegend-end:active{background:var(--empty-hover)}
.plegend-end.empty{color:var(--ink2);font-weight:400}

/* ---- GraphMode: an L-shaped axis (left and bottom) with a heading and low / high text ---- */
.gaxis{position:relative;min-width:0;min-height:0}
.ay{grid-area:2 / 1;margin-right:7px;padding-right:9px;display:grid;grid-template-columns:24px 1fr}
.ax{grid-area:3 / 2;margin-top:7px;padding-top:9px;display:flex;flex-direction:column;gap:4px}
.ay .yticks{grid-column:2;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;min-height:0}
.ay .glab.t{grid-column:1;grid-row:1;justify-self:center;align-self:center;writing-mode:vertical-rl;max-height:100%}
.ax .xticks{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ax .glab.t{align-self:center}
.gline{position:absolute;background:var(--ink);pointer-events:none}
.ay .gline{right:0;top:0;bottom:0;width:1.5px}
.ax .gline{left:0;right:0;top:0;height:1.5px}
/* GraphMode's two axes meet at a corner, so each line overshoots slightly there to form that joint.
   Priority shows only one axis at a time with no partner to meet, so its line stays flush instead. */
.frame[data-mode="graph"] .ay .gline{bottom:-7px}
.frame[data-mode="graph"] .ax .gline{left:-7px}
.ay .gline::before,.ax .gline::before{content:"";position:absolute;width:8px;height:8px;transform:translate(-50%,-50%) rotate(45deg)}
.ay .gline::before{left:50%;top:4px;border-top:1.5px solid var(--ink);border-left:1.5px solid var(--ink)}
.ax .gline::before{left:calc(100% - 4px);top:50%;border-top:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
.glab{
  min-width:0;border:0;background:transparent;padding:2px 4px;border-radius:2px;
  font:500 11px/1.25 var(--font-ui);letter-spacing:.04em;color:var(--ink);
}
.glab.t{font-size:12px;letter-spacing:.1em}
.glab span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-all}
.glab:active{background:var(--empty-hover)}
.glab.empty{box-shadow:inset 0 0 0 1px var(--line2);color:var(--ink2)}
.glab.empty::after{content:attr(data-ph);font-weight:400;opacity:.75}
.yticks .glab{text-align:right;max-width:100%}

/* ---- mode controls in the bottom bar ---- */
.viewbar{justify-content:center}
.listbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.colstep{display:flex;align-items:center;gap:8px}
.colstep .lbl{font-size:12px;color:var(--ink2);letter-spacing:.08em}
.colstep button{width:40px;height:40px;border:1px solid var(--line2);border-radius:3px;background:transparent;font:300 22px/1 var(--font-ui);display:grid;place-items:center}
.colstep button:active:not(:disabled){background:var(--empty-hover)}
.colstep button:disabled{opacity:.3;cursor:default}
.colstep output{min-width:2.4em;text-align:center;font:300 22px var(--font-ui);font-variant-numeric:tabular-nums}
.modebtn.primary{background:var(--ink);color:var(--bg)}
#transposeBtn{
  grid-area:1 / 1;align-self:stretch;justify-self:stretch;margin:0 6px 6px 0;border:1px solid var(--line2);border-radius:3px;
  background:transparent;color:var(--ink);display:grid;place-items:center;
}
#transposeBtn:active{background:var(--empty-hover)}
.priobar{display:flex;flex-direction:column;gap:8px}
.pshapes{display:flex;gap:6px}
.pshapes .pk{height:40px;flex-direction:row;gap:8px;font-size:12px}
.pg{display:block;flex:none;width:18px;height:18px;border:1px solid var(--line2)}
.pg-v{background:linear-gradient(to bottom,var(--accent),color-mix(in srgb,var(--accent) 8%,var(--surface)))}
.pg-h{background:linear-gradient(to right,var(--accent),color-mix(in srgb,var(--accent) 8%,var(--surface)))}
.pg-c{background:radial-gradient(circle farthest-corner,var(--accent),color-mix(in srgb,var(--accent) 8%,var(--surface)))}
.pswrow{display:flex;align-items:center;gap:8px}
.pswrow .lbl{font-size:12px;color:var(--ink2);letter-spacing:.08em;flex:none}
.pswatches{display:flex;gap:5px;overflow-x:auto;padding:4px;scrollbar-width:none}
.pswatches::-webkit-scrollbar{display:none}
.psw{flex:none;width:20px;height:20px;border:0;border-radius:2px;background:var(--c);position:relative;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.psw.on::after{content:"";position:absolute;inset:-3px;border:1.5px solid var(--ink);border-radius:3px}

@media (prefers-reduced-motion:reduce){
  .intro .cell,.brand{animation:none}
  *{transition-duration:0s!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" aria-label="Grids">
      <svg class="mark" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
        <rect x=".5" y=".5" width="6" height="6"/><rect x="8" y=".5" width="6" height="6" fill="currentColor"/><rect x="15.5" y=".5" width="6" height="6"/>
        <rect x=".5" y="8" width="6" height="6"/><rect x="8" y="8" width="6" height="6"/><rect x="15.5" y="8" width="6" height="6"/>
        <rect x=".5" y="15.5" width="6" height="6"/><rect x="8" y="15.5" width="6" height="6"/><rect x="15.5" y="15.5" width="6" height="6"/>
      </svg>
      <span class="word">Grids</span>
    </div>
    <span class="tag">階層でひろがるメモ</span>
  </header>

  <div class="vaultrow">
    <nav id="vtabs" class="vtabs" role="tablist" aria-label="保管庫"></nav>
    <div class="vtools">
      <button id="vAdd" class="ico" aria-label="保管庫を追加">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="vImport" class="ico" aria-label="保管庫を読み込む（JSONファイル）" title="読み込む（JSON）">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M12 4l-4 4M12 4l4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button id="vMenu" class="ico" aria-label="保管庫の管理" aria-haspopup="menu" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div id="menu" class="menu" role="menu" hidden>
      <button id="mRename" role="menuitem">名前を変更</button>
      <button id="mExport" role="menuitem">書き出す…</button>
      <hr class="msep">
      <button id="mDelete" role="menuitem" class="danger">この保管庫を削除</button>
    </div>
    <div id="exportMenu" class="menu" role="menu" hidden>
      <button data-f="csv" role="menuitem">CSV（表計算ソフト向け）</button>
      <button data-f="md" role="menuitem">Markdown（.md）</button>
      <button data-f="txt" role="menuitem">テキスト（.txt）</button>
      <hr class="msep">
      <button data-f="json" role="menuitem">JSON（バックアップ・全項目）</button>
    </div>
  </div>

  <div class="crumbrow">
    <button id="up" class="ico" aria-label="ひとつ上の階層へ" style="visibility:hidden">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <nav id="crumbs" class="crumbs" aria-label="階層"></nav>
    <button id="editParent" class="pill" hidden>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>
      このマスを編集
    </button>
  </div>

  <div class="moderow">
    <label class="modesel"><span>モード</span>
      <select id="modeSel" aria-label="モード">
        <option value="free">Free</option>
        <option value="list">List</option>
        <option value="matrix">Matrix</option>
        <option value="graph">Graph</option>
        <option value="priority">Priority</option>
      </select>
    </label>
    <div id="modeDims" class="dims" aria-live="polite"></div>
  </div>

  <main id="stage" class="stage">
    <div id="frame" class="frame" data-mode="free" style="--cols:8;--rows:8">
      <div id="colHead" class="colhead"></div>
      <div id="rowHead" class="rowhead"></div>
      <div id="gAy" class="gaxis ay">
        <button class="glab t" data-g="yt" data-ph="見出し"><span></span></button>
        <div class="yticks">
          <button class="glab" data-g="ymax" data-ph="最大"><span></span></button>
          <button class="glab" data-g="ymin" data-ph="最小"><span></span></button>
        </div>
        <i class="gline"></i>
      </div>
      <div id="gAx" class="gaxis ax">
        <div class="xticks">
          <button class="glab" data-g="xmin" data-ph="最小"><span></span></button>
          <button class="glab" data-g="xmax" data-ph="最大"><span></span></button>
        </div>
        <button class="glab t" data-g="xt" data-ph="見出し"><span></span></button>
        <i class="gline"></i>
      </div>
      <button id="transposeBtn" hidden aria-label="行と列を入れ替える（転置）" title="行と列を反転">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11M4 5l3-3M4 5l3 3"/><path d="M20 19H9M20 19l-3-3M20 19l-3 3"/></svg>
      </button>
      <div id="board" class="board intro"></div>
    </div>
    <div id="zoomBar" class="zoombar">
      <button id="zoomOut" aria-label="縮小">−</button>
      <button id="zoomFit" aria-label="画面に合わせる">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button id="zoomIn" aria-label="拡大">+</button>
    </div>
  </main>

  <footer class="bar">
    <div id="prioBar" class="priobar" hidden>
      <div id="pShapes" class="pshapes" role="radiogroup" aria-label="背景の形">
        <button class="pk" role="radio" data-s="v" aria-checked="false"><i class="pg pg-v"></i><span>上下</span></button>
        <button class="pk" role="radio" data-s="h" aria-checked="false"><i class="pg pg-h"></i><span>左右</span></button>
        <button class="pk" role="radio" data-s="c" aria-checked="false"><i class="pg pg-c"></i><span>円</span></button>
      </div>
      <div class="pswrow"><span class="lbl">色</span><div id="pSwatches" class="pswatches"></div></div>
      <div class="plegend">
        <button id="pHead" class="plegend-head" aria-label="見出し"><span></span></button>
        <div class="plegend-row">
          <button id="pHigh" class="plegend-end" aria-label="濃い側の文字"><span></span></button>
          <div id="pGrad" class="plegend-grad"></div>
          <button id="pLow" class="plegend-end" aria-label="薄い側の文字"><span></span></button>
        </div>
      </div>
    </div>

    <div id="viewBar" class="viewbar">
      <button id="editModeBtn" class="modebtn">マスを編集</button>
    </div>

    <div id="listBar" class="listbar" hidden>
      <div class="colstep">
        <span class="lbl">横</span>
        <button id="colDec" aria-label="横列を減らす">−</button>
        <output id="colOut">8</output>
        <button id="colInc" aria-label="横列を増やす">+</button>
      </div>
      <button id="listAdd" class="modebtn primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>追加
      </button>
    </div>

    <div id="editBar" class="editbar" hidden>
      <div class="erow">
        <button id="lockBtn" class="lockbtn on" aria-pressed="true"><span id="lockIcon"></span><span id="lockLbl">縦横比ロック</span></button>
        <div id="dimOut" class="dims" aria-live="polite"></div>
        <button id="editDone" class="editdone">完了</button>
      </div>
      <div class="erow">
        <button id="rmBtn" class="step rm" aria-label="選んだ位置のマスを削除">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>削除
        </button>
        <div id="picker" class="picker" role="radiogroup" aria-label="追加・削除する位置"></div>
        <button id="addBtn" class="step add" aria-label="選んだ位置にマスを追加">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>追加
        </button>
      </div>
    </div>

    <p id="hintView" class="hint"><b>タップ</b>で開く・読む　<b>長押し</b>で編集　<b>ドラッグ</b>で入れ替え</p>
    <p id="hintMatrix" class="hint" hidden>ラベルをドラッグすると、行・列ごと入れ替わります。右上の反転ボタンで行と列を入れ替えられます</p>
    <p id="hintList" class="hint" hidden>「追加」から入力すると左詰めで並びます。空にしたマスは詰められ、空の行は消えます</p>
    <p id="hintEdit" class="hint" hidden>青い線の側に行・列を追加／削除します。削除する側のマスの中身は近くの空きへ移ります</p>
  </footer>
</div>

<div id="scrim" class="scrim"></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="マスの編集">
  <div class="cbar"></div>
  <div class="sheet-head">
    <div class="seg" role="group" aria-label="マスの種類">
      <button data-type="note">メモ</button>
      <button data-type="grid">グリッド</button>
    </div>
    <button id="sheetDone" class="done">完了</button>
  </div>
  <div class="row-label first">タイトル</div>
  <input id="sheetTitle" class="field" type="text" maxlength="80" placeholder="タイトル" autocomplete="off" enterkeyhint="next">
  <div class="row-label">内容</div>
  <textarea id="sheetText" class="field" rows="5" placeholder="内容を書く…"></textarea>
  <div class="row-label">色</div>
  <div id="swatches" class="swatches"></div>
  <div id="alphaRow" class="alpha off">
    <span class="alpha-lbl">透明度</span>
    <input id="alpha" type="range" min="0" max="90" step="5" value="70" aria-label="色の透明度">
    <output id="alphaOut" for="alpha">—</output>
  </div>
  <div id="mediaSection">
    <div class="row-label">画像</div>
    <div class="imagerow">
      <div id="imgPreviewWrap" class="imgpreview" hidden><img id="imgPreview" alt=""></div>
      <input type="file" id="imageFile" accept="image/*" hidden>
      <button id="imgAddBtn" class="btn ghosty">画像を追加</button>
      <button id="imgRemoveBtn" class="btn ghosty" hidden>画像を削除</button>
    </div>
    <div class="row-label">アイコン</div>
    <div id="iconRow" class="iconrow"></div>
  </div>
  <div class="sheet-actions">
    <button id="openGrid" class="btn primary">このグリッドを開く</button>
    <button id="clearCell" class="btn ghosty">このマスを空にする</button>
  </div>
</section>
<div id="dlgScrim" class="dlg-scrim"></div>
<div id="dlg" class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <h2 id="dlgTitle" class="dlg-title"></h2>
  <p id="dlgMsg" class="dlg-msg" hidden></p>
  <input id="dlgInput" class="field" type="text" maxlength="24" autocomplete="off" hidden>
  <div class="dlg-actions">
    <button id="dlgCancel" class="btn">キャンセル</button>
    <button id="dlgOk" class="btn primary">OK</button>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

const dimOut = $('#dimOut'), lockBtn = $('#lockBtn'), lockIcon = $('#lockIcon'), lockLbl = $('#lockLbl');
const picker = $('#picker'), rmBtn = $('#rmBtn'), addBtn = $('#addBtn');
const colDec = $('#colDec'), colInc = $('#colInc'), colOut = $('#colOut'), listAddBtn = $('#listAdd');
const pShapes = $('#pShapes'), pSwatches = $('#pSwatches'), pGrad = $('#pGrad'), pHead = $('#pHead'), pHigh = $('#pHigh'), pLow = $('#pLow');
const hintView = $('#hintView'), hintEdit = $('#hintEdit'), hintList = $('#hintList'), hintMatrix = $('#hintMatrix');

/* ---------- data ---------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const fitLabels = (a, n) => Array.from({ length: n }, (_, i) => (Array.isArray(a) && typeof a[i] === 'string' ? a[i].slice(0, 24) : ''));
const blankGraph = () => ({ xt: '', xmin: '', xmax: '', yt: '', ymin: '', ymax: '' });
const cleanGraph = g => { const o = blankGraph(); Object.keys(o).forEach(k => { if (g && typeof g[k] === 'string') o[k] = g[k].slice(0, 24); }); return o; };
const blankPAxis = () => ({ head: '', high: '', low: '' });
const cleanPAxis = g => { const o = blankPAxis(); Object.keys(o).forEach(k => { if (g && typeof g[k] === 'string') o[k] = g[k].slice(0, 24); }); return o; };
const newNode = (rows, cols = rows) => ({
  mode: 'free', rows, cols, cells: new Array(rows * cols).fill(null),
  colLabels: fitLabels(null, cols), rowLabels: fitLabels(null, rows), graph: blankGraph(), paxis: blankPAxis(), pshape: 'v', pcolor: P_DEFAULT
});
const newCell = () => ({ id: uid(), type: 'note', title: '', text: '', color: null, alpha: DEFAULT_ALPHA, child: null, icon: null, image: null });
const newVault = name => ({ id: uid(), name, root: newNode(ROOT_SIZE), path: [] });
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
const isHex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
const clampA = a => Math.min(1, Math.max(MIN_ALPHA, a));
const cleanName = s => (typeof s === 'string' ? s.replace(/\s+/g, ' ').trim().slice(0, 24) : '');
const isEmptyNode = n => n.cells.every(c => !c);
const titleOf = c => ((c && c.title) || '').trim() || '無題';
const syncLabels = n => { n.colLabels = fitLabels(n.colLabels, n.cols); n.rowLabels = fitLabels(n.rowLabels, n.rows); };

/* colour helpers */
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
}
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const mixRGB = (a, b, p) => a.map((v, i) => v * p + b[i] * (1 - p));      /* a at share p over b */
const surfaceRGB = () => (isDark() ? [26, 29, 32] : [246, 247, 247]);
const inkRGB = () => (isDark() ? [231, 233, 234] : [26, 29, 32]);
function textOn(rgb) {
  const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  const L = .2126 * f(rgb[0]) + .7152 * f(rgb[1]) + .0722 * f(rgb[2]);
  return 1.05 / (L + .05) >= (L + .05) / .061 ? '#f6f6f4' : '#1a1d20';
}
const onColor = (hex, a = 1) => textOn(mixRGB(hexRGB(hex), surfaceRGB(), a));

/* priority mode: how strong the background is at a given cell (1 = strongest). Rendered as one flat
   dot per cell (not a smooth pixel gradient), so the colour steps cell by cell like a dot gradation. */
function prioIntensity(n, r, k) {
  if (n.pshape === 'h') return 1 - (k + .5) / n.cols;
  if (n.pshape === 'c') {
    const dx = k + .5 - n.cols / 2, dy = r + .5 - n.rows / 2;
    return 1 - Math.hypot(dx, dy) / Math.hypot(n.cols / 2, n.rows / 2);
  }
  return 1 - (r + .5) / n.rows;
}
const rgbCSS = a => `rgb(${a.map(v => Math.round(Math.min(255, Math.max(0, v)))).join(',')})`;
function prioBaseRGB(node, r, k) {
  const t = prioIntensity(node, r, k);
  return mixRGB(hexRGB(node.pcolor), surfaceRGB(), P_WEAK + (P_STRONG - P_WEAK) * t);
}
/* the flat priority tone at a cell's position, optionally with its own colour blended in — used
   for the border ring of a filled cell, and as a full background wash for an empty one */
function prioTone(node, i, color, alpha) {
  const base = prioBaseRGB(node, Math.floor(i / node.cols), i % node.cols);
  return color ? mixRGB(hexRGB(color), base, alpha) : base;
}

/* list mode: filled cells packed to the left, rows only as many as needed */
function listReflow(node) {
  const cells = node.cells.filter(Boolean);
  const rows = Math.max(1, Math.min(MAX, Math.ceil(cells.length / node.cols)));
  const out = new Array(rows * node.cols).fill(null);
  cells.slice(0, out.length).forEach((c, i) => { out[i] = c; });
  node.rows = rows; node.cells = out; syncLabels(node);
}

function cleanNode(n, depth = 0) {
  const pick = v => { const x = parseInt(v, 10); return x > 0 ? Math.min(MAX, x) : 0; };
  const rows = pick(n && n.rows) || pick(n && n.size) || CHILD_SIZE;   /* older data only had a square `size` */
  const cols = pick(n && n.cols) || pick(n && n.size) || CHILD_SIZE;
  const cells = new Array(rows * cols).fill(null);
  if (n && Array.isArray(n.cells)) {
    for (let i = 0; i < Math.min(n.cells.length, cells.length); i++) {
      const c = n.cells[i];
      if (!c || typeof c !== 'object') continue;
      let title = typeof c.title === 'string' ? c.title : null;
      let text = typeof c.text === 'string' ? c.text : '';
      if (title === null) {
        const lines = text.split('\n'), k = lines.findIndex(l => l.trim());
        if (k >= 0) { title = lines[k].trim(); text = lines.slice(k + 1).join('\n').replace(/^\n+/, ''); }
        else { title = ''; text = ''; }
      }
      const cell = {
        id: typeof c.id === 'string' && c.id ? c.id : uid(),
        type: c.type === 'grid' ? 'grid' : 'note',
        title: title.slice(0, 80),
        text,
        color: isHex(c.color) ? c.color.toLowerCase() : null,
        alpha: typeof c.alpha === 'number' && isFinite(c.alpha) ? clampA(c.alpha) : DEFAULT_ALPHA,
        icon: typeof c.icon === 'string' && ICONS[c.icon] ? c.icon : null,
        image: typeof c.image === 'string' && /^data:image\/(png|jpeg|webp);base64,/.test(c.image) && c.image.length < 700000 ? c.image : null,
        child: null
      };
      if (c.child && depth < 40) cell.child = cleanNode(c.child, depth + 1);
      if (cell.type === 'grid' && !cell.child) cell.child = newNode(CHILD_SIZE);
      cells[i] = cell;
    }
  }
  const node = {
    mode: MODES.includes(n && n.mode) ? n.mode : 'free',
    rows, cols, cells,
    colLabels: fitLabels(n && n.colLabels, cols),
    rowLabels: fitLabels(n && n.rowLabels, rows),
    graph: cleanGraph(n && n.graph),
    paxis: cleanPAxis(n && n.paxis),
    pshape: SHAPES.includes(n && n.pshape) ? n.pshape : 'v',
    pcolor: isHex(n && n.pcolor) ? n.pcolor.toLowerCase() : P_DEFAULT
  };
  if (node.mode === 'list') listReflow(node);
  return node;
}

const cleanPath = p => (Array.isArray(p) ? p.filter(x => typeof x === 'string') : []);
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (Array.isArray(d.vaults) && d.vaults.length) {
        const vaults = d.vaults.slice(0, MAX_VAULTS).map((v, k) => ({
          id: typeof v.id === 'string' && v.id ? v.id : uid(),
          name: cleanName(v.name) || `保管庫 ${k + 1}`,
          root: v.root ? cleanNode(v.root) : newNode(ROOT_SIZE),
          path: cleanPath(v.path)
        }));
        return { vaults, cur: vaults.some(v => v.id === d.cur) ? d.cur : vaults[0].id };
      }
      if (d.root) {
        const v = { id: uid(), name: '保管庫 1', root: cleanNode(d.root), path: cleanPath(d.path) };
        return { vaults: [v], cur: v.id };
      }
    }
  } catch (e) {}
  const v = newVault('保管庫 1');
  return { vaults: [v], cur: v.id };
}
const S = load();
const V = () => S.vaults.find(v => v.id === S.cur) || S.vaults[0];

let saveT = null, warned = false;
function save() { clearTimeout(saveT); saveT = setTimeout(flush, 250); }
function flush() {
  try { localStorage.setItem(KEY, JSON.stringify({ v: 3, vaults: S.vaults, cur: S.cur })); }
  catch (e) { if (!warned) { warned = true; toast('この環境では保存できません。開いている間だけ保持されます'); } }
}
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

/* ---------- navigation ---------- */
function resolve() {
  const v = V(), nodes = [v.root], cells = [];
  let node = v.root, valid = 0;
  for (const id of v.path) {
    const c = node.cells.find(x => x && x.id === id);
    if (!c || c.type !== 'grid' || !c.child) break;
    cells.push(c); node = c.child; nodes.push(node); valid++;
  }
  if (valid !== v.path.length) v.path = v.path.slice(0, valid);
  return { nodes, cells, node };
}

/* ---------- render ---------- */
function miniHTML(ch) {
  let h = '';
  ch.cells.forEach((c, i) => {
    if (!c) return;
    h += `<i class="${c.type === 'grid' ? 'g' : ''}" style="grid-area:${Math.floor(i / ch.cols) + 1}/${(i % ch.cols) + 1};--c:${c.color || 'var(--ink2)'};--a:${c.color ? c.alpha : 1}"></i>`;
  });
  return `<div class="miniwrap"><div class="mini" style="--cols:${ch.cols};--rows:${ch.rows}">${h}</div></div>`;
}

function cellHTML(c, i, ctx) {
  const node = ctx.node;
  if (!c) {
    const pr = ctx.prio ? `--pr:${rgbCSS(prioTone(node, i, null, 1))};` : '';
    return `<div class="cell empty" data-i="${i}" role="button" tabindex="-1" style="${pr}--i:${i}" aria-label="空のマス ${i + 1}"></div>`;
  }
  const base = `data-i="${i}" role="button" tabindex="0"${ctx.list ? ` data-n="${i + 1}"` : ''}`;
  const ttl = c.title.trim(), body = c.text.trim();
  let on = c.color ? onColor(c.color, c.alpha) : null;
  const pr = ctx.prio ? `--pr:${rgbCSS(prioTone(node, i, c.color, c.alpha))};` : '';
  const cs = (c.color ? `--c:${c.color};--a:${c.alpha};` : '') + (on ? `--on:${on};` : '') + pr + `--i:${i}`;
  if (c.type === 'grid') {
    return `<div class="cell grid${c.color ? ' colored' : ''}" ${base} style="${cs}" aria-label="グリッド ${esc(ttl || '無題')}"><div class="txt${ttl ? '' : ' ph'}">${esc(ttl || '無題')}</div><div class="gridmark" aria-hidden="true">${GRIDMARK}</div></div>`;
  }
  if (c.type === 'note') {
    let inner;
    if (c.image) inner = `<img class="cimg" src="${c.image}" alt="" draggable="false">`;
    else if (c.icon) inner = `<div class="cicon" aria-hidden="true">${iconSVG(c.icon)}</div>`;
    else inner = `<div class="txt${ttl ? '' : ' ph'}">${esc(ttl || (body ? '無題' : ''))}</div>`;
    return `<div class="cell note${c.color ? ' colored' : ''}${body ? ' w' : ''}" ${base} style="${cs}" aria-label="メモ ${esc(ttl || '無題')}">${inner}</div>`;
  }
}

function headsHTML(node) {
  const mk = (arr, ax, label) => arr.map((l, i) =>
    `<button class="lab${l ? '' : ' empty'}" data-ax="${ax}" data-i="${i}" aria-label="${label} ${i + 1}"><span>${esc(l)}</span></button>`).join('');
  colHead.innerHTML = mk(node.colLabels, 'c', '横軸の指標');
  rowHead.innerHTML = mk(node.rowLabels, 'r', '縦軸の指標');
}

function renderGraph(node) {
  [gAy, gAx].forEach(root => root.querySelectorAll('.glab').forEach(b => {
    const v = node.graph[b.dataset.g] || '';
    b.classList.toggle('empty', !v);
    b.firstElementChild.textContent = v;
  }));
  gAy.hidden = gAx.hidden = node.mode !== 'graph';
}

function render() {
  const r = resolve(), node = r.node;
  if (E.node !== node) { E.node = node; if (node.rows !== node.cols) E.lock = false; }
  const list = node.mode === 'list', prio = node.mode === 'priority', matrix = node.mode === 'matrix';
  const editing = E.on && !list;
  frame.style.setProperty('--cols', node.cols);
  frame.style.setProperty('--rows', node.rows);
  frame.dataset.mode = node.mode;
  board.style.setProperty('--pbase', node.pcolor);
  board.classList.toggle('editing', editing);
  board.classList.toggle('list', list);
  SHAPES.forEach(s => board.classList.toggle('prio-' + s, prio && node.pshape === s));
  const ctx = { node, list, prio, maxd: Math.max(node.rows, node.cols) };
  let h = '';
  for (let i = 0; i < node.cells.length; i++) h += cellHTML(node.cells[i], i, ctx);
  board.innerHTML = h + markersHTML(editing);
  if (matrix) headsHTML(node); else { colHead.innerHTML = ''; rowHead.innerHTML = ''; }
  renderGraph(node);
  transposeBtn.hidden = node.mode !== 'matrix';
  renderCrumbs(r);
  renderBar(node, editing);
  requestAnimationFrame(updateScrollable);
}
let rq = 0;
function scheduleRender() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; render(); }); }
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render()); } catch (e) {}

/* the board scrolls once it no longer fits at the minimum cell size */
function updateScrollable() {
  stage.classList.toggle('scrollable', stage.scrollWidth > stage.clientWidth + 1 || stage.scrollHeight > stage.clientHeight + 1);
}
if (window.ResizeObserver) { const ro = new ResizeObserver(updateScrollable); ro.observe(stage); ro.observe(frame); }

/* ---------- view zoom: lets a large grid (up to 32x32 and beyond) be shrunk to fit, or a small
   one be enlarged, independent of the natural "fit to screen" size ---------- */
const zoomOutBtn = $('#zoomOut'), zoomInBtn = $('#zoomIn'), zoomFitBtn = $('#zoomFit');
const VZ_MIN = 0.3, VZ_MAX = 3;
let VZ = 1;
function setViewZoom(z) {
  VZ = Math.min(VZ_MAX, Math.max(VZ_MIN, z));
  frame.style.setProperty('--zoom', VZ);
  zoomOutBtn.disabled = VZ <= VZ_MIN + 1e-6;
  zoomInBtn.disabled = VZ >= VZ_MAX - 1e-6;
  requestAnimationFrame(updateScrollable);
}
zoomOutBtn.addEventListener('click', () => setViewZoom(VZ / 1.25));
zoomInBtn.addEventListener('click', () => setViewZoom(VZ * 1.25));
zoomFitBtn.addEventListener('click', () => setViewZoom(1));
setViewZoom(1);

function renderCrumbs(r) {
  const v = V();
  const items = [{ d: 0, label: v.name }];
  r.cells.forEach((c, k) => items.push({ d: k + 1, label: titleOf(c) }));
  crumbsEl.innerHTML = items.map((it, k) =>
    (k ? '<span class="sep">/</span>' : '') +
    `<button class="crumb${k === items.length - 1 ? ' cur' : ''}" data-d="${it.d}">${esc(it.label)}</button>`
  ).join('');
  crumbsEl.scrollLeft = crumbsEl.scrollWidth;
  upBtn.style.visibility = v.path.length ? 'visible' : 'hidden';
  editBtn.hidden = !v.path.length;
}

const cellEl = i => board.querySelector(`.cell[data-i="${i}"]`);

function zoom(kind, rect) {
  if (reduce) return;
  const b = board.getBoundingClientRect();
  if (kind === 'in' && rect) {
    board.style.transformOrigin = `${rect.left + rect.width / 2 - b.left}px ${rect.top + rect.height / 2 - b.top}px`;
    board.animate([{ transform: 'scale(.16)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)' });
  } else {
    board.style.transformOrigin = '50% 50%';
    board.animate([{ transform: 'scale(1.22)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
}

function enter(c, rect) {
  V().path.push(c.id);
  stage.scrollTo(0, 0);
  setViewZoom(1);
  render(); zoom('in', rect); save();
}
function goTo(depth) {
  const v = V();
  if (depth >= v.path.length) return;
  v.path = v.path.slice(0, depth);
  stage.scrollTo(0, 0);
  setViewZoom(1);
  render(); zoom('out'); save();
}

crumbsEl.addEventListener('click', e => {
  const b = e.target.closest('.crumb'); if (!b) return;
  goTo(+b.dataset.d);
});
upBtn.addEventListener('click', () => goTo(V().path.length - 1));
editBtn.addEventListener('click', () => {
  const r = resolve(); if (!r.cells.length) return;
  const cell = r.cells[r.cells.length - 1], parent = r.nodes[r.nodes.length - 2];
  openSheet(parent, parent.cells.indexOf(cell));
});

/* ---------- modes ---------- */
/* switching to List repacks the cells, so the person is warned first */
function listImpact(node) {
  const filled = [];
  node.cells.forEach((c, i) => { if (c) filled.push(i); });
  if (!filled.length) return null;
  const rowsTo = Math.max(1, Math.ceil(filled.length / node.cols));
  const moved = filled.filter((idx, k) => idx !== k).length;
  if (rowsTo === node.rows && !moved) return null;
  return { moved, rowsFrom: node.rows, rowsTo };
}
function applyMode(node, m) {
  if (resolve().node !== node || node.mode === m) return;
  node.mode = m;
  if (m === 'list') listReflow(node);
  render();
  if (!reduce) board.animate([{ opacity: .35, transform: 'scale(.985)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
  save();
}
function requestMode(m) {
  const node = resolve().node;
  if (!MODES.includes(m) || node.mode === m) { modeSel.value = node.mode; return; }
  if (m === 'list') {
    const im = listImpact(node);
    if (im) {
      showDialog({
        title: '配置が変わります',
        message: 'Listモードでは、マスが左上から順に詰めて並び、縦の数は自動で決まります。\n'
          + `・縦の数：${im.rowsFrom} → ${im.rowsTo}\n`
          + `・位置が変わるマス：${im.moved} 個\n`
          + '切り替えたあとは、元の配置に戻せません。',
        ok: '切り替える', danger: true,
        onOk: () => applyMode(node, m),
        onCancel: () => { modeSel.value = node.mode; }
      });
      return;
    }
  }
  applyMode(node, m);
}
modeSel.addEventListener('change', () => requestMode(modeSel.value));

/* list mode */
const filledCount = n => n.cells.reduce((k, c) => k + (c ? 1 : 0), 0);
function setCols(n) {
  const node = resolve().node;
  n = Math.max(MIN, Math.min(MAX, n));
  if (n === node.cols) return;
  if (filledCount(node) > MAX * n) { toast('マスが入りきらないため、これ以上横列を減らせません'); return; }
  node.cols = n; listReflow(node);
  render(); save();
}
function listAdd() {
  const node = resolve().node;
  if (node.mode !== 'list') return;
  listReflow(node);
  const n = filledCount(node);
  if (n >= MAX * node.cols) { toast('これ以上は追加できません。横列を増やしてください'); return; }
  if (n >= node.cells.length) {                     /* room for one more row while the new cell is being written */
    node.rows++;
    for (let k = 0; k < node.cols; k++) node.cells.push(null);
    syncLabels(node);
  }
  render();
  const el = cellEl(n);
  if (el) { try { el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {} }
  openSheet(node, n);
}
colDec.addEventListener('click', () => setCols(resolve().node.cols - 1));
colInc.addEventListener('click', () => setCols(resolve().node.cols + 1));
listAddBtn.addEventListener('click', listAdd);

/* priority mode */
pShapes.addEventListener('click', e => {
  const b = e.target.closest('.pk'); if (!b) return;
  resolve().node.pshape = b.dataset.s;
  render(); save();
});
pSwatches.innerHTML = PALETTE.map(c => `<button class="psw" data-c="${c}" style="--c:${c}" aria-label="背景色 ${c}"></button>`).join('');
pSwatches.addEventListener('click', e => {
  const b = e.target.closest('.psw'); if (!b) return;
  resolve().node.pcolor = b.dataset.c;
  render(); save();
});

/* matrix mode: edit an axis label */
frame.addEventListener('click', e => {
  const b = e.target.closest('.lab'); if (!b) return;
  if (suppressLabClick) return;
  const node = resolve().node, i = +b.dataset.i, col = b.dataset.ax === 'c';
  const arr = col ? node.colLabels : node.rowLabels;
  showDialog({
    title: col ? `横軸の指標（${i + 1}列目）` : `縦軸の指標（${i + 1}行目）`,
    input: { value: arr[i] || '', placeholder: '指標の名前' }, ok: '決定',
    onOk: v => { arr[i] = cleanName(v); render(); save(); }
  });
});

/* matrix mode: swap the grid's rows and columns wholesale */
function transposeNode(node) {
  const { rows, cols, cells, colLabels, rowLabels } = node;
  const nc = new Array(rows * cols).fill(null);
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) nc[k * rows + r] = cells[r * cols + k];
  node.rows = cols; node.cols = rows; node.cells = nc;
  node.colLabels = rowLabels; node.rowLabels = colLabels;
}
transposeBtn.addEventListener('click', () => {
  const node = resolve().node;
  transposeNode(node);
  render(); save();
  if (!reduce) board.animate([{ transform: 'rotate(2deg) scale(.97)', opacity: .5 }, { transform: 'none', opacity: 1 }], { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' });
});

/* matrix mode: drag a label to swap its whole row or column with another */
let LP = null, suppressLabClick = false;
function swapCols(node, a, b) {
  if (a === b) return;
  for (let r = 0; r < node.rows; r++) { const ia = r * node.cols + a, ib = r * node.cols + b; [node.cells[ia], node.cells[ib]] = [node.cells[ib], node.cells[ia]]; }
  [node.colLabels[a], node.colLabels[b]] = [node.colLabels[b], node.colLabels[a]];
}
function swapRows(node, a, b) {

    img.onload = () => {
      const MAXD = 640;
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, MAXD / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
      const cnv = document.createElement('canvas'); cnv.width = w; cnv.height = h;
      const cctx = cnv.getContext('2d');
      cctx.fillStyle = '#ffffff'; cctx.fillRect(0, 0, w, h);
      cctx.drawImage(img, 0, 0, w, h);
      if (!sh) return;
      ensureCell().image = cnv.toDataURL('image/jpeg', 0.78);
      syncSheet(false); scheduleRender(); save();
    };
    img.onerror = () => toast('画像を読み込めませんでした');
    img.src = reader.result;
  };
  reader.onerror = () => toast('ファイルを読み込めませんでした');
  reader.readAsDataURL(file);
}
imgAddBtn.addEventListener('click', () => { imageFile.value = ''; imageFile.click(); });
imageFile.addEventListener('change', () => {
  const f = imageFile.files && imageFile.files[0];
  if (f) readImageFile(f);
});
imgRemoveBtn.addEventListener('click', () => {
  if (!sh) return;
  const c = sh.node.cells[sh.idx]; if (!c) return;
  c.image = null;
  syncSheet(false); scheduleRender(); save();
});

function ensureCell() {
  let c = sh.node.cells[sh.idx];
  if (!c) { c = newCell(); sh.node.cells[sh.idx] = c; }
  return c;
}
function normalize(node, idx) {
  const c = node.cells[idx]; if (!c) return;
  if (c.type === 'note' && !c.title.trim() && !c.text.trim() && !c.color && !c.image && !c.icon && (!c.child || isEmptyNode(c.child))) node.cells[idx] = null;
}

function syncSheet(initial) {
  const c = sh.node.cells[sh.idx], type = c ? c.type : 'note', col = (c && c.color) || '';
  const a = c ? c.alpha : DEFAULT_ALPHA;
  segs.forEach(b => b.classList.toggle('on', b.dataset.type === type));
  if (initial) { titleIn.value = c ? c.title : ''; ta.value = c ? c.text : ''; }
  ta.placeholder = type === 'grid' ? 'このグリッドの説明（任意）' : '内容を書く…';
  ta.rows = type === 'grid' ? 3 : 5;
  const t = Math.round((1 - a) * 100 / 5) * 5;
  alphaIn.value = t;
  alphaOut.textContent = col ? t + '%' : '—';
  alphaRow.classList.toggle('off', !col);
  sheet.style.setProperty('--cbar', col || 'transparent');
  sheet.style.setProperty('--cc', col || 'var(--surface)');
  sheet.style.setProperty('--cf', col || 'var(--accent)');
  let inPalette = false;
  swBox.querySelectorAll('.sw[data-c]').forEach(b => {
    const on = b.dataset.c === col;
    if (on && col) inPalette = true;
    b.classList.toggle('on', on);
  });
  customSw.classList.toggle('on', !!col && !inPalette);
  customSw.style.setProperty('--c', col || '#888888');
  openBtn.hidden = !(type === 'grid' && c && sh.node === resolve().node);
  clearBtn.hidden = !c;
  mediaSection.hidden = type !== 'note';
  const img = c && c.image;
  imgPreviewWrap.hidden = !img;
  if (img) imgPreview.src = img;
  imgAddBtn.textContent = img ? '画像を変更' : '画像を追加';
  imgRemoveBtn.hidden = !img;
  const icon = (c && c.icon) || '';
  iconRow.querySelectorAll('.icn').forEach(b => b.classList.toggle('on', b.dataset.icon === icon));
  if (initial) disarm();
}

function openSheet(node, idx) {
  if (sh && sh.node === node && sh.idx === idx) return;
  if (sh) closeSheet();
  sh = { node, idx };
  syncSheet(true);
  scrim.classList.add('open'); sheet.classList.add('open');
  sheet.scrollTop = 0;
  if (!node.cells[idx]) setTimeout(() => { if (sh) titleIn.focus({ preventScroll: true }); }, 280);
}
function closeSheet() {
  if (!sh) return;
  const { node, idx } = sh;
  sh = null;
  normalize(node, idx);
  if (node.mode === 'list') listReflow(node);
  sheet.classList.remove('open'); scrim.classList.remove('open');
  titleIn.blur(); ta.blur(); disarm();
  render(); save();
}
scrim.addEventListener('click', closeSheet);
doneBtn.addEventListener('click', closeSheet);

const composing = e => e.isComposing || e.keyCode === 229;

titleIn.addEventListener('input', () => {
  if (!sh) return;
  ensureCell().title = titleIn.value;
  syncSheet(false); scheduleRender(); save();
});
titleIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !composing(e)) { e.preventDefault(); ta.focus(); }
});
ta.addEventListener('input', () => {
  if (!sh) return;
  ensureCell().text = ta.value;
  syncSheet(false); scheduleRender(); save();
});

segs.forEach(b => b.addEventListener('click', () => {
  if (!sh) return;
  const c = ensureCell(), t = b.dataset.type;
  c.type = t;
  if (t === 'grid' && !c.child) c.child = newNode(CHILD_SIZE);
  syncSheet(false); scheduleRender(); save();
}));

swBox.addEventListener('click', e => {
  const b = e.target.closest('button.sw'); if (!b || !sh) return;
  ensureCell().color = b.dataset.c || null;
  syncSheet(false); scheduleRender(); save();
});
customInput.addEventListener('input', () => {
  if (!sh) return;
  ensureCell().color = customInput.value.toLowerCase();
  syncSheet(false); scheduleRender(); save();
});
alphaIn.addEventListener('input', () => {
  if (!sh) return;
  const c = ensureCell();
  if (!c.color) return;
  c.alpha = clampA(1 - (+alphaIn.value) / 100);
  alphaOut.textContent = alphaIn.value + '%';
  scheduleRender(); save();
});

openBtn.addEventListener('click', () => {
  if (!sh) return;
  const { node, idx } = sh, c = node.cells[idx];
  const el = cellEl(idx), rect = el ? el.getBoundingClientRect() : null;
  closeSheet();
  if (c && c.type === 'grid' && c.child) enter(c, rect);
});

let armed = false, armT;
function disarm() {
  armed = false; clearTimeout(armT);
  clearBtn.classList.remove('armed');
  clearBtn.textContent = 'このマスを空にする';
}
clearBtn.addEventListener('click', () => {
  if (!sh) return;
  const c = sh.node.cells[sh.idx]; if (!c) return;
  const hasData = c.title.trim() || c.text.trim() || c.image || c.icon || (c.child && !isEmptyNode(c.child));
  if (hasData && !armed) {
    armed = true;
    clearBtn.classList.add('armed');
    clearBtn.textContent = 'もう一度タップで削除（中身も消えます）';
    armT = setTimeout(disarm, 3200);
    return;
  }
  disarm();
  sh.node.cells[sh.idx] = null;
  closeSheet();
});

/* keep the sheet above the on-screen keyboard */
function fitViewport() {
  const v = window.visualViewport; if (!v) return;
  const kb = Math.max(0, innerHeight - v.height - v.offsetTop);
  sheet.style.bottom = kb + 'px';
  document.documentElement.style.setProperty('--vvh', v.height + 'px');
}
if (window.visualViewport) ['resize', 'scroll'].forEach(t => visualViewport.addEventListener(t, fitViewport));

/* ---------- dialog ---------- */
let dlgCb = null, dlgCancelCb = null;
function showDialog({ title, message = '', input = null, ok = 'OK', danger = false, onOk, onCancel }) {
  dlgTitle.textContent = title;
  dlgMsg.textContent = message; dlgMsg.hidden = !message;
  dlgInput.hidden = !input;
  if (input) { dlgInput.value = input.value || ''; dlgInput.placeholder = input.placeholder || ''; }
  dlgOk.textContent = ok;
  dlgOk.classList.toggle('danger', danger);
  dlgCb = onOk; dlgCancelCb = onCancel || null;
  dlg.classList.add('open'); dlgScrim.classList.add('open');
  setTimeout(() => { if (!dlg.classList.contains('open')) return; if (input) { dlgInput.focus(); dlgInput.select(); } else dlgCancel.focus(); }, 60);
}
function closeDialog(cancelled = true) {
  const cc = dlgCancelCb;
  dlg.classList.remove('open'); dlgScrim.classList.remove('open');
  dlgCb = null; dlgCancelCb = null;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (cancelled && cc) cc();
}
dlgOk.addEventListener('click', () => { const cb = dlgCb, v = dlgInput.value; closeDialog(false); if (cb) cb(v); });
dlgCancel.addEventListener('click', () => closeDialog());
dlgScrim.addEventListener('click', () => closeDialog());
dlgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !composing(e)) { e.preventDefault(); dlgOk.click(); }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (dlg.classList.contains('open')) closeDialog();
  else if (!exportMenu.hidden) closeExportMenu();
  else if (!menu.hidden) closeMenu();
  else if (sh) closeSheet();
  else if (E.on) setEdit(false);
});

/* ---------- vaults ---------- */
function renderVaults() {
  vtabs.innerHTML = S.vaults.map(v =>
    `<button class="vtab${v.id === S.cur ? ' cur' : ''}" role="tab" aria-selected="${v.id === S.cur}" data-id="${v.id}">${esc(v.name)}</button>`
  ).join('');
  const cur = vtabs.querySelector('.cur');
  if (cur) {
    const l = cur.offsetLeft, r = l + cur.offsetWidth;
    if (l < vtabs.scrollLeft || r > vtabs.scrollLeft + vtabs.clientWidth) vtabs.scrollLeft = l - (vtabs.clientWidth - cur.offsetWidth) / 2;
  }
}
function vaultAnim() {
  stage.scrollTo(0, 0);
  setViewZoom(1);
  if (reduce) return;
  board.style.transformOrigin = '50% 50%';
  board.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
function selectVault(id) {
  if (id === S.cur || !S.vaults.some(v => v.id === id)) return;
  S.cur = id;
  renderVaults(); render(); vaultAnim(); save();
}
function defaultVaultName() {
  const names = new Set(S.vaults.map(v => v.name));
  let n = S.vaults.length + 1;
  while (names.has(`保管庫 ${n}`)) n++;
  return `保管庫 ${n}`;
}
function addVault() {
  if (S.vaults.length >= MAX_VAULTS) { toast(`保管庫は ${MAX_VAULTS} 個までです`); return; }
  showDialog({
    title: '新しい保管庫', input: { value: defaultVaultName(), placeholder: '保管庫の名前' }, ok: '追加',
    onOk: val => {
      const v = newVault(cleanName(val) || defaultVaultName());
      S.vaults.push(v); S.cur = v.id;
      renderVaults(); render(); vaultAnim(); save();
    }
  });
}
/* import a vault previously written by "書き出す… → JSON": makes a new vault rather than touching
   any existing one, so bringing a file in from another device never overwrites local data */
function uniqueVaultName(base) {
  const names = new Set(S.vaults.map(v => v.name));
  if (!names.has(base)) return base;
  let n = 2;
  while (names.has(`${base} (${n})`)) n++;
  return `${base} (${n})`;
}
function importVaultData(data) {
  if (!data || typeof data !== 'object' || !data.root || typeof data.root !== 'object') {
    toast('読み込めませんでした。Gridsの「書き出す → JSON」で保存したファイルを選んでください');
    return;
  }
  if (S.vaults.length >= MAX_VAULTS) { toast(`保管庫は ${MAX_VAULTS} 個までです`); return; }
  const name = uniqueVaultName(cleanName(data.name) || '読み込んだ保管庫');
  let root;
  try { root = cleanNode(data.root); }
  catch (e) { toast('読み込めませんでした。ファイルの中身が壊れているようです'); return; }
  const v = { id: uid(), name, root, path: [] };
  S.vaults.push(v); S.cur = v.id;
  renderVaults(); render(); vaultAnim(); save();
  toast(`「${name}」を読み込みました`);
}
vImport.addEventListener('click', () => { closeMenu(); closeExportMenu(); importFile.value = ''; importFile.click(); });
importFile.addEventListener('change', () => {
  const f = importFile.files && importFile.files[0]; if (!f) return;
  if (f.size > 8 * 1024 * 1024) { toast('ファイルが大きすぎます'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch (e) { toast('読み込めませんでした。JSON形式のファイルではないようです'); return; }
    importVaultData(data);
  };
  reader.onerror = () => toast('ファイルを読み込めませんでした');
  reader.readAsText(f, 'utf-8');
});

function renameVault() {
  const v = V();
  showDialog({
    title: '名前を変更', input: { value: v.name, placeholder: '保管庫の名前' }, ok: '変更',
    onOk: val => {
      const name = cleanName(val); if (!name) return;
      v.name = name;
      renderVaults(); render(); save();
    }
  });
}
function deleteVault() {
  const v = V();
  showDialog({
    title: '保管庫を削除',
    message: `「${v.name}」と、その中のメモをすべて削除します。この操作は取り消せません。`,
    ok: '削除', danger: true,
    onOk: () => {
      const i = S.vaults.indexOf(v);
      S.vaults.splice(i, 1);
      if (!S.vaults.length) S.vaults.push(newVault('保管庫 1'));
      S.cur = S.vaults[Math.min(i, S.vaults.length - 1)].id;
      renderVaults(); render(); vaultAnim(); save();
    }
  });
}
function closeMenu() { menu.hidden = true; vMenu.setAttribute('aria-expanded', 'false'); }
function closeExportMenu() { exportMenu.hidden = true; }

function walkVault(node, path, out) {
  node.cells.forEach(c => {
    if (!c) return;
    const p = path.concat(titleOf(c));
    out.push({ path: p, type: c.type, title: c.title.trim(), text: c.text, color: c.color || '' });
    if (c.type === 'grid' && c.child) walkVault(c.child, p, out);
  });
}
function csvField(v) {
  v = String(v == null ? '' : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function toCSV(rows) {
  const lines = [['階層', '種類', 'タイトル', '内容', '色'].join(',')];
  rows.forEach(r => lines.push([r.path.join(' > '), r.type === 'grid' ? 'グリッド' : 'メモ', r.title, r.text, r.color].map(csvField).join(',')));
  return '\ufeff' + lines.join('\r\n');
}
function toOutline(rows, md) {
  return rows.map(r => {
    const indent = '  '.repeat(r.path.length - 1);
    let s = indent + (md ? '- ' : '・') + (r.title || '無題') + (r.type === 'grid' ? (md ? ' 📁' : '［グリッド］') : '');
    const body = r.text.trim();
    if (body) s += '\n' + body.split('\n').map(l => indent + '  ' + l).join('\n');
    return s;
  }).join('\n');
}
function downloadText(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function doExport(fmt) {
  const v = V(), rows = [];
  walkVault(v.root, [], rows);
  const name = (v.name || 'grids').replace(/[\\/:*?"<>|]/g, '_');
  if (fmt === 'csv') downloadText(name + '.csv', toCSV(rows), 'text/csv;charset=utf-8');
  else if (fmt === 'md') downloadText(name + '.md', `# ${v.name}\n\n` + toOutline(rows, true), 'text/markdown;charset=utf-8');
  else if (fmt === 'txt') downloadText(name + '.txt', v.name + '\n\n' + toOutline(rows, false), 'text/plain;charset=utf-8');
  else downloadText(name + '.json', JSON.stringify(v, null, 2), 'application/json;charset=utf-8');
  toast('書き出しました');
}

vtabs.addEventListener('click', e => {
  const b = e.target.closest('.vtab'); if (!b) return;
  selectVault(b.dataset.id);
});
vAdd.addEventListener('click', () => { closeMenu(); addVault(); });
vMenu.addEventListener('click', () => {
  const open = menu.hidden;
  menu.hidden = !open;
  vMenu.setAttribute('aria-expanded', String(open));
});
mRename.addEventListener('click', () => { closeMenu(); renameVault(); });
mExport.addEventListener('click', () => { closeMenu(); exportMenu.hidden = false; });
mDelete.addEventListener('click', () => { closeMenu(); deleteVault(); });
exportMenu.addEventListener('click', e => {
  const b = e.target.closest('button[data-f]'); if (!b) return;
  closeExportMenu(); doExport(b.dataset.f);
});
document.addEventListener('pointerdown', e => {
  if (!menu.hidden && !e.target.closest('#menu, #vMenu')) closeMenu();
  if (!exportMenu.hidden && !e.target.closest('#exportMenu')) closeExportMenu();
});

/* ---------- start ---------- */
renderVaults();
render();
setTimeout(() => board.classList.remove('intro'), 1300);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
